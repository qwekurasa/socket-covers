<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Накладки на розетку</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f2f2f0; --panel:#ffffff; --ink:#151515; --muted:#8a8a86; --line:#e4e4e0;
  --f:"Onest", "Helvetica Neue", Arial, sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 14px/1.45 var(--f);-webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-columns:minmax(0,1fr) 380px;height:100%}
.stage{position:relative;min-width:0}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.brand{position:absolute;left:32px;top:28px;font-weight:600;letter-spacing:-.01em;font-size:15px}
.brand span{color:var(--muted);font-weight:400}
.seg{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);display:flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{font:inherit;border:0;background:transparent;color:var(--muted);padding:7px 16px;border-radius:999px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.dims{position:absolute;left:32px;bottom:34px;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.panel{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.scroll{flex:1;overflow:auto;padding:28px 28px 8px}
h1{font-size:22px;font-weight:500;letter-spacing:-.02em;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 28px}
.step{border-top:1px solid var(--line);padding:18px 0 22px}
.step h2{display:flex;justify-content:space-between;font-size:13px;font-weight:500;margin:0 0 14px}
.step h2 em{font-style:normal;color:var(--muted);font-weight:400}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{font:inherit;color:var(--ink);text-align:left;background:transparent;border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.opt small{color:var(--muted);font-size:12px}
.opt[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.sw{display:flex;flex-wrap:wrap;gap:10px}
.sw button{width:34px;height:34px;border-radius:50%;border:1px solid rgba(0,0,0,.12);cursor:pointer;padding:0}
.sw button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--panel),0 0 0 3px var(--ink)}
.foot{border-top:1px solid var(--line);padding:16px 28px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.foot .meta{font-size:12px;color:var(--muted)}
.foot .meta b{display:block;color:var(--ink);font-weight:500;font-size:14px}
.cta{font:500 14px var(--f);background:var(--ink);color:#fff;border:0;border-radius:999px;padding:13px 22px;text-decoration:none;white-space:nowrap}
button:focus-visible,.cta:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
@media (max-width:860px){
  .app{grid-template-columns:1fr;grid-template-rows:58vh auto;height:auto}
  .stage{height:58vh}
  .brand{left:16px;top:16px}.dims{display:none}.seg{bottom:14px}.seg button{padding:7px 12px;font-size:13px}
  .panel{border-left:0;border-top:1px solid var(--line)}
  .scroll{padding:22px 16px 4px}.foot{padding:14px 16px 20px;position:sticky;bottom:0;background:var(--panel)}
}
</style>
</head>
<body>
<div class="app">
  <div class="stage">
    <canvas id="c" aria-label="3D-модель накладки и розетки"></canvas>
    <div class="brand">накладка <span>/ AtlasDesign</span></div>
    <div class="dims" id="dims"></div>
    <div class="seg" role="group" aria-label="Вид">
      <button id="v-assembled" aria-pressed="true">Собрано</button>
      <button id="v-exploded" aria-pressed="false">В разборе</button>
      <button id="v-bare" aria-pressed="false">Без накладки</button>
    </div>
  </div>
  <div class="panel">
    <div class="scroll">
      <h1>Накладка на розетку</h1>
      <p class="sub">Печатается на 3D-принтере и надевается поверх рамки. Видно только гнездо.</p>
      <div class="step">
        <h2>1. Форма <em id="l-form"></em></h2>
        <div class="opts" id="forms">
          <button class="opt" id="f-plain" data-v="plain"><span>Гладкая</span><small>88 × 88 мм</small></button>
          <button class="opt" id="f-spikes" data-v="spikes"><span>Ёж</span><small>109 × 109 мм</small></button>
          <button class="opt" id="f-waves" data-v="waves"><span>Волны</span><small>96 × 96 мм</small></button>
          <button class="opt" id="f-flower" data-v="flower"><span>Цветок</span><small>124 × 124 мм</small></button>
        </div>
      </div>
      <div class="step">
        <h2>2. Цвет накладки <em id="l-color"></em></h2>
        <div class="sw" id="colors"></div>
      </div>
      <div class="step">
        <h2>3. Розетка <em id="l-socket"></em></h2>
        <div class="opts" id="sockets">
          <button class="opt" id="s-carbon" data-s="carbon"><span>Карбон</span><small>ATN001045</small></button>
          <button class="opt" id="s-white" data-s="white"><span>Белый</span><small>ATN000145</small></button>
        </div>
      </div>
    </div>
    <div class="foot">
      <div class="meta"><b id="sum"></b>рамка ATN000101, 1 пост</div>
      <a class="cta" id="dl" href="files/socket_cover_plain.stl" download>Скачать STL</a>
    </div>
  </div>
</div>

<script type="importmap">
{"imports":{"three":"./vendor/three/build/three.module.js","three/addons/":"./vendor/three/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const FORMS = { plain:"Гладкая", spikes:"Ёж", waves:"Волны", flower:"Цветок" };
const DIMS = { plain:"88 × 88 × 14", spikes:"109 × 109 × 20", waves:"96 × 96 × 15", flower:"124 × 124 × 16" };
const COLORS = [["Графит","#2b2c2e"],["Мел","#efede8"],["Терракота","#b5563c"],["Шалфей","#93a38c"],["Кобальт","#2f4fb0"],["Охра","#d29a32"],["Пыльная роза","#c99a94"]];
const SOCKET = { carbon:["Карбон","#2a2b2d"], white:["Белый","#f1f1ee"] };
const state = { form:"plain", color:0, socket:"carbon", view:"assembled" };

// ---------- renderer ----------
const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(26, 1, 1, 3000);
camera.position.set(-300, 150, 330);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.enablePan = false; controls.minDistance = 200; controls.maxDistance = 800;
controls.target.set(0, 0, 0);
const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(-120, 180, 220);
key.castShadow = true; key.shadow.mapSize.set(2048, 2048); key.shadow.radius = 6; key.shadow.bias = -0.0005;
Object.assign(key.shadow.camera, { left:-120, right:120, top:120, bottom:-120, near:10, far:800 });
scene.add(key, new THREE.AmbientLight(0xffffff, 0.25));

// ---------- procedural textures ----------
function canvasTex(size, draw, repeat = 1){
  const c = document.createElement("canvas"); c.width = c.height = size; draw(c.getContext("2d"), size);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat, repeat); t.anisotropy = 8; return t;
}
const rnd = (a, b) => a + Math.random() * (b - a);
// оцинковка: «цветы» кристаллов
const spangle = canvasTex(1024, (g, s) => {
  g.fillStyle = "#9a9da2"; g.fillRect(0, 0, s, s);
  for (let i = 0; i < 260; i++) {
    const x = rnd(0, s), y = rnd(0, s), r = rnd(25, 80), n = 7 + (Math.random() * 5 | 0);
    g.beginPath();
    for (let k = 0; k < n; k++) { const a = k / n * Math.PI * 2 + rnd(-.3, .3), rr = r * rnd(.6, 1.1); g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
    const v = rnd(130, 200) | 0; g.fillStyle = `rgba(${v},${v + 2},${v + 6},.55)`; g.fill();
  }
  const img = g.getImageData(0, 0, s, s), d = img.data;
  for (let i = 0; i < d.length; i += 4) { const n = rnd(-10, 10); d[i] += n; d[i + 1] += n; d[i + 2] += n; }
  g.putImageData(img, 0, 0);
}, 0.012);
spangle.colorSpace = THREE.SRGBColorSpace;
// мелкая шагрень пластика
const grain = canvasTex(512, (g, s) => {
  const img = g.createImageData(s, s), d = img.data;
  for (let i = 0; i < d.length; i += 4) { const v = 128 + rnd(-45, 45); d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255; }
  g.putImageData(img, 0, 0);
}, 0.08);
// слои FDM-печати 0.2 мм
const layers = canvasTex(256, (g, s) => {
  for (let y = 0; y < s; y++) { const v = 128 + 70 * Math.sin(y / s * Math.PI * 2 * 32) + rnd(-8, 8); g.fillStyle = `rgb(${v},${v},${v})`; g.fillRect(0, y, s, 1); }
}, 0.156);

// box-проекция UV в мм (у STL нет развёртки)
function boxUV(geo){
  geo = geo.index ? geo.toNonIndexed() : geo; geo.computeVertexNormals();
  const p = geo.attributes.position, n = geo.attributes.normal, uv = new Float32Array(p.count * 2);
  for (let i = 0; i < p.count; i++) {
    const ax = Math.abs(n.getX(i)), ay = Math.abs(n.getY(i)), az = Math.abs(n.getZ(i));
    let u, v;
    if (az >= ax && az >= ay) { u = p.getX(i); v = p.getY(i); }
    else if (ax >= ay) { u = p.getY(i); v = p.getZ(i); }
    else { u = p.getX(i); v = p.getZ(i); }
    uv[i * 2] = u; uv[i * 2 + 1] = v;
  }
  geo.setAttribute("uv", new THREE.BufferAttribute(uv, 2)); return geo;
}

// ---------- materials ----------
const M = {
  steel: new THREE.MeshStandardMaterial({ map:spangle, metalness:1, roughness:.42, roughnessMap:grain }),
  zinc: new THREE.MeshStandardMaterial({ color:0xc4c7cc, metalness:1, roughness:.28 }),
  nickel: new THREE.MeshStandardMaterial({ color:0xd8dadd, metalness:1, roughness:.18 }),
  body: new THREE.MeshStandardMaterial({ color:SOCKET.carbon[1], roughness:.62, bumpMap:grain, bumpScale:.4 }),
  frame: new THREE.MeshStandardMaterial({ color:SOCKET.carbon[1], roughness:.5, bumpMap:grain, bumpScale:.3 }),
  shutter: new THREE.MeshStandardMaterial({ color:0x5d6064, roughness:.5 }),
  cover: new THREE.MeshPhysicalMaterial({ color:COLORS[0][1], roughness:.5, clearcoat:.15, clearcoatRoughness:.6, bumpMap:layers, bumpScale:.6 }),
};
const PART_MAT = { plate:"steel", claws:"steel", screws:"zinc", clips:"nickel", body:"body", frame:"frame", shutters:"shutter" };

// модель: Z к зрителю (как в CAD), Y вверх — совпадает с осями three
const root = new THREE.Group(); scene.add(root);
const parts = {}; const covers = {};
const loader = new GLTFLoader();
const EXPLODE = { claws:-45, plate:0, body:0, shutters:0, clips:0, screws:0, frame:50, cover:115 };
let target = { ...EXPLODE }; Object.keys(target).forEach(k => target[k] = 0);
const cur = { ...target };

function prep(obj, mat){
  obj.traverse(o => { if (o.isMesh) { o.geometry = boxUV(o.geometry); o.material = mat; o.castShadow = o.receiveShadow = true; } });
  return obj;
}
loader.load("models/socket.glb", g => {
  g.scene.children.slice().forEach(node => {
    const name = node.name; const holder = new THREE.Group(); holder.add(node);
    prep(node, M[PART_MAT[name]]); parts[name] = holder; root.add(holder);
  });
});
async function loadCover(v){
  if (!covers[v]) { const g = await loader.loadAsync(`models/${v}.glb`); const h = new THREE.Group(); h.add(prep(g.scene, M.cover)); covers[v] = h; }
  return covers[v];
}
let coverNode = null;
async function setForm(v){
  state.form = v; render();
  const node = await loadCover(v);
  if (state.form !== v) return;
  if (coverNode) root.remove(coverNode);
  coverNode = node; root.add(node); applyView();
}
function applyView(){
  const ex = state.view === "exploded";
  for (const k in target) target[k] = ex ? EXPLODE[k] : 0;
  if (coverNode) coverNode.visible = state.view !== "bare";
}

// ---------- UI ----------
const $ = id => document.getElementById(id);
const sw = $("colors");
COLORS.forEach(([name, hex], i) => {
  const b = document.createElement("button"); b.id = "c-" + i; b.title = name; b.setAttribute("aria-label", name); b.style.background = hex;
  b.onclick = () => { state.color = i; M.cover.color.set(hex); render(); }; sw.appendChild(b);
});
document.querySelectorAll("#forms .opt").forEach(b => b.onclick = () => setForm(b.dataset.v));
document.querySelectorAll("#sockets .opt").forEach(b => b.onclick = () => {
  state.socket = b.dataset.s; const c = SOCKET[state.socket][1]; M.body.color.set(c); M.frame.color.set(c); render();
});
[["v-assembled","assembled"],["v-exploded","exploded"],["v-bare","bare"]].forEach(([id, v]) => $(id).onclick = () => { state.view = v; applyView(); render(); });
function render(){
  document.querySelectorAll("#forms .opt").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === state.form));
  document.querySelectorAll("#sockets .opt").forEach(b => b.setAttribute("aria-pressed", b.dataset.s === state.socket));
  sw.querySelectorAll("button").forEach((b, i) => b.setAttribute("aria-pressed", i === state.color));
  ["assembled","exploded","bare"].forEach(v => $("v-" + v).setAttribute("aria-pressed", state.view === v));
  $("l-form").textContent = FORMS[state.form]; $("l-color").textContent = COLORS[state.color][0]; $("l-socket").textContent = SOCKET[state.socket][0];
  $("dims").textContent = DIMS[state.form] + " мм";
  $("sum").textContent = `${FORMS[state.form]}, ${COLORS[state.color][0].toLowerCase()}`;
  $("dl").href = `files/socket_cover_${state.form}.stl`;
}

function resize(){
  const r = canvas.parentElement.getBoundingClientRect();
  renderer.setSize(r.width, r.height, false); camera.aspect = r.width / r.height; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(canvas.parentElement); resize();
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
renderer.setAnimationLoop(() => {
  const k = reduce ? 1 : 0.12;
  for (const p in cur) cur[p] += (target[p] - cur[p]) * k;
  for (const n in parts) parts[n].position.z = cur[n] ?? 0;
  if (coverNode) coverNode.position.z = cur.cover;
  controls.update(); renderer.render(scene, camera);
});
render(); setForm("plain");
</script>
</body>
</html>
